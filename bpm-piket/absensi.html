<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Piket - BPM Adhiwira Nawasena</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="logo-area">
        <img src="assets/logo-bpm.png" alt="Logo BPM" class="logo" onerror="this.style.display='none'">
        <div class="title-area">
          <h1>BPM Adhiwira Nawasena</h1>
          <p>Absensi Piket</p>
        </div>
      </div>
      <nav class="nav">
        <a href="index.html" class="nav-link">Jadwal Piket</a>
        <a href="absensi.html" class="nav-link active">Absensi</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <section class="today-info">
      <p id="today-date">Memuat tanggal...</p>
    </section>

    <section class="absensi-card">
      <h2>Form Absensi Piket</h2>
      <p class="absensi-desc">Isi data kehadiran piket hari ini.</p>

      <form id="absensi-form" class="absensi-form">

        <div class="form-group">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
        </div>

        <div class="form-group">
          <label for="jabatan">Jabatan / Divisi</label>
          <input type="text" id="jabatan" name="jabatan" placeholder="Contoh: Divisi Internal" required>
        </div>

        <div class="form-group">
          <label for="tanggal">Tanggal</label>
          <input type="date" id="tanggal" name="tanggal" required>
        </div>

        <div class="form-group">
          <label for="status">Status Kehadiran</label>
          <select id="status" name="status" required>
            <option value="">-- Pilih Status --</option>
            <option value="Hadir">Hadir</option>
            <option value="Izin">Izin</option>
            <option value="Sakit">Sakit</option>
            <option value="Tidak Hadir">Tidak Hadir</option>
          </select>
        </div>

        <div class="form-group">
          <label for="keterangan">Keterangan (opsional)</label>
          <textarea id="keterangan" name="keterangan" rows="3" placeholder="Catatan tambahan bila perlu"></textarea>
        </div>

        <button type="submit" class="btn-primary">Kirim Absensi</button>

      </form>

      <div id="absensi-status" class="absensi-status"></div>
    </section>

    <section class="cta-back">
      <a href="index.html" class="btn-secondary">Kembali ke Jadwal Piket</a>
    </section>

  </main>

  <footer class="footer">
    <p>BPM Adhiwira Nawasena - Sistem Piket</p>
  </footer>

  <script src="absensi.js"></script>
</body>
</html>
