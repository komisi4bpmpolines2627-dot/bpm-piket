<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piket BPM Adhiwira Nawasena</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="logo-area">
        <img src="assets/logo-bpm.png" alt="Logo BPM" class="logo" onerror="this.style.display='none'">
        <div class="title-area">
          <h1>BPM Adhiwira Nawasena</h1>
          <p>Sistem Piket dan Aturan Jaga</p>
        </div>
      </div>
      <nav class="nav">
        <a href="index.html" class="nav-link active">Jadwal Piket</a>
        <a href="absensi.html" class="nav-link">Absensi</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <section class="today-info">
      <p id="today-date">Memuat tanggal...</p>
    </section>

    <section class="day-selector">
      <h2>Pilih Hari</h2>
      <div class="day-buttons" id="day-buttons">
        <button class="day-btn" data-day="Senin">Senin</button>
        <button class="day-btn" data-day="Selasa">Selasa</button>
        <button class="day-btn" data-day="Rabu">Rabu</button>
        <button class="day-btn" data-day="Kamis">Kamis</button>
        <button class="day-btn" data-day="Jumat">Jumat</button>
        <button class="day-btn" data-day="Sabtu">Sabtu</button>
        <button class="day-btn" data-day="Minggu">Minggu</button>
      </div>
      <button class="btn-today" id="btn-today">Tampilkan Hari Ini</button>
    </section>

    <section class="schedule-card" id="schedule-display">
      <div class="placeholder">
        <p>Pilih hari di atas untuk melihat aturan dan jadwal piket.</p>
      </div>
    </section>

    <section class="cta-absensi">
      <p>Sudah selesai piket hari ini?</p>
      <a href="absensi.html" class="btn-primary">Isi Absensi</a>
    </section>

  </main>

  <footer class="footer">
    <p>BPM Adhiwira Nawasena - Sistem Piket</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
